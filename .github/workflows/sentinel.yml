# .github/workflows/sentinel.yml
name: sentinel

on:
  schedule:
    - cron: '00 9 * * *'
      timezone: "Europe/Paris"
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: write

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ny4rl4th0t3p/chain-registry-sentinel@v0.8.0
        with:
          registry: .
          chains: cosmoshub,osmosis,juno,akash,stride,kujira,archway,dymension,evmos,umee,quasar,stargaze
          state-branch: sentinel-state
          min-failures: 3
          pr-cooldown-days: 0
          max-endpoint-prs: 15
          # Chain-death demo settings: streaks count runs, so two dispatches mature the
          # candidates (evmos, umee, quasar, stargaze in this subset). max-status-prs lifted
          # above the candidate count so none wait behind the alphabetical default cap of 3.
          # Restore chain-death-min-runs to 14 (default) after the demo.
          chain-death-min-runs: 2
          max-status-prs: 10
          github-token: ${{ secrets.GITHUB_TOKEN }}
