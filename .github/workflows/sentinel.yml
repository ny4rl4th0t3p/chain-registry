# .github/workflows/sentinel.yml
name: sentinel

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: write

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ny4rl4th0t3p/chain-registry-sentinel@v0.5.0
        with:
          registry: .
          chains: cosmoshub,osmosis,juno,akash,stride,kujira,archway,dymension,evmos,umee,quasar,stargaze
          state-branch: sentinel-state
          min-failures: 3
          pr-cooldown-days: 3
          max-new-prs: 15
          github-token: ${{ secrets.GITHUB_TOKEN }}
